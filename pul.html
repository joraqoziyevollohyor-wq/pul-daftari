/* ===== DIZAYN-QOLLANMA.md, 4-bo'lim: aynan nusxa ===== */
:root{

  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --bg:#ffffff;--ink:#111316;--muted:#5c6370;--mute2:#8b919a;--line:#e3e5e8;--line-2:#111316;
  --accent:#1f5fa8;--accent-ink:#ffffff;--tile:#f6f7f8;--newbg:#f3f7fc;
  --ok:#1e7a4f;--warn:#9a6200;--warn-bar:#c8860a;--off:#c9cdd3;--danger:#b3261e;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1013;--ink:#e8eaed;--muted:#9aa0a8;--mute2:#6b7178;--line:#262a30;--line-2:#3a3f47;
  --accent:#7fb2e5;--accent-ink:#0e1013;--tile:#15181c;--newbg:#121a23;
  --ok:#3fb37f;--warn:#e0a33a;--warn-bar:#e0a33a;--off:#4a4f57;--danger:#f08a8a;}}
:root[data-theme="dark"]{
  --bg:#0e1013;--ink:#e8eaed;--muted:#9aa0a8;--mute2:#6b7178;--line:#262a30;--line-2:#3a3f47;
  --accent:#7fb2e5;--accent-ink:#0e1013;--tile:#15181c;--newbg:#121a23;
  --ok:#3fb37f;--warn:#e0a33a;--warn-bar:#e0a33a;--off:#4a4f57;--danger:#f08a8a;}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-text-size-adjust:100%}
.mono{font-family:var(--f-mono)}
main{max-width:560px;margin:0 auto;padding-bottom:calc(86px + env(safe-area-inset-bottom))}

.bar{display:flex;align-items:baseline;padding:18px 20px 12px;border-bottom:1px solid var(--line-2)}
.bar h1{flex:1;margin:0;font-size:22px;font-weight:600}
.bar .meta{font-size:13px;color:var(--muted);font-family:var(--f-mono)}

.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.kpi button{all:unset;cursor:pointer;padding:16px 0 14px 20px;border-right:1px solid var(--line)}
.kpi button:last-child{border-right:0}
.kpi b{display:block;font-family:var(--f-mono);font-weight:500;font-size:34px;line-height:1}
.kpi span{display:block;font-size:13px;color:var(--muted);margin-top:6px}

.lbl2{display:flex;align-items:baseline;gap:8px;padding:16px 20px 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lbl2 .grow{flex:1}
.lbl2 a{color:var(--accent);text-decoration:none;text-transform:none;letter-spacing:0;font-size:13px}

.att{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:12px 20px;border-top:1px solid var(--line)}
.att .bar4{width:4px;height:36px;border-radius:2px;flex:none}
.att .gr{flex:1;min-width:0}
.att .t1{font-size:15px;font-weight:500}
.att .t2{font-size:13px;color:var(--muted)}

.trow{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px;align-items:center;padding:10px 20px;border-top:1px solid var(--line);font-size:15px}
.trow.h{font-size:11px;color:var(--mute2);letter-spacing:.06em;text-transform:uppercase;border-top:0;padding-top:0;padding-bottom:6px}
.trow .n{display:flex;align-items:center;gap:10px;min-width:0}
.trow .n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tm2{text-align:right;font-family:var(--f-mono);font-size:14px}
.dot{width:8px;height:8px;border-radius:2px;flex:none}

.row{display:flex;align-items:center;gap:12px;padding:11px 20px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.row .av{width:40px;height:40px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;background:#eef2f7;color:#1f4f86}
.row .gr{flex:1;min-width:0}
.row .t1{font-size:15px}
.row .t2{font-size:13px;color:var(--muted)}
.row .v{text-align:right;font-family:var(--f-mono);font-size:15px}
.row.new{background:var(--newbg)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border-bottom:1px solid var(--line)}
.seg button{all:unset;cursor:pointer;text-align:center;height:42px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent}
.seg button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}

button,.btn{font:inherit;min-height:44px;border-radius:8px;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 14px;border:1px solid var(--line-2);background:transparent;color:var(--ink);font-size:15px;text-decoration:none}
.btn.pri{border:0;background:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.abar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}

input,select,textarea{font:inherit;color:var(--ink);background:var(--tile);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:0 12px;width:100%}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:12px;border:1px solid var(--line)}

.set{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;padding:13px 20px;border-bottom:1px solid var(--line)}
.set .k{flex:1;font-size:15px}
.set .val{font-size:14px;color:var(--muted);margin-right:8px}

.backb{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:12px 20px;color:var(--accent);font-size:15px;border-bottom:1px solid var(--line)}

.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--bg);border-top:1px solid var(--line-2);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{all:unset;cursor:pointer;position:relative;text-align:center;min-height:60px;padding:8px 2px;font-size:11px;font-weight:500;color:var(--muted);border-top:3px solid transparent;margin-top:-1px}
.tabs button svg{display:block;margin:0 auto 3px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-top-color:var(--accent)}
.tabs .bdg{position:absolute;top:6px;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600;line-height:18px}

/* ===== Shu ilova uchun qo'shimcha (qo'llanma qoidalari ichida) ===== */
[hidden]{display:none!important}
.backb{box-sizing:border-box;width:100%}
.kpi b small{font-size:15px;font-weight:500;margin-left:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.trow.money{grid-template-columns:minmax(0,1fr) 112px 44px}
.trow.mon3{grid-template-columns:minmax(0,1fr) 104px 104px}
.trow.two{grid-template-columns:minmax(0,1fr) auto}
button.trow,button.row{all:unset;box-sizing:border-box;cursor:pointer;width:100%}
button.trow{display:grid;padding:10px 20px;border-top:1px solid var(--line);font-size:15px}
button.row{display:flex;align-items:center;gap:12px;padding:11px 20px;border-top:1px solid var(--line)}
.pos{color:var(--ok)}
.neg{color:var(--danger)}
.wrn{color:var(--warn)}
.row .av{font-family:var(--f-mono);font-weight:500;font-size:13px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .row .av{background:#17222e;color:#a9cbee}}
:root[data-theme="dark"] .row .av{background:#17222e;color:#a9cbee}
.row .v{white-space:nowrap}
.row .v small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted)}
.row .t1,.row .t2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.month{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.month button{all:unset;cursor:pointer;width:52px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.month button[disabled]{color:var(--off);cursor:default}
.month .m{flex:1;text-align:center;font-size:15px;font-weight:500}
.empty{padding:14px 20px;margin:0;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
.status{position:sticky;top:0;z-index:5;padding:10px 20px;font-size:14px;background:var(--bg);color:var(--muted);border-bottom:1px solid var(--line)}
.status.bad{color:var(--danger)}
.status.good{color:var(--ok)}
.note{padding:12px 20px;margin:0;font-size:14px;line-height:1.5;border-top:1px solid var(--line)}
.note code{font-family:var(--f-mono);font-size:13px;background:var(--tile);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.prog{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.search{padding:10px 20px;border-bottom:1px solid var(--line)}
/* Forma */
.form{padding:4px 20px 8px}
.fld{display:block;padding-top:14px}
.fld > span{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fld .big{font-family:var(--f-mono);font-size:28px;font-weight:500;height:56px}
.fld .hint{display:block;font-size:13px;color:var(--muted);margin-top:6px;text-transform:none;letter-spacing:0}
select{appearance:none;-webkit-appearance:none;background-image:none}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chips button{border:1px solid var(--line);background:transparent;color:var(--ink);font-size:13px;padding:6px 4px;line-height:1.2}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;padding-top:10px}
.chk input{width:22px;min-height:22px;height:22px;accent-color:var(--accent)}
.fbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px 0 4px}
.fbar.one{grid-template-columns:1fr}
.msg{font-size:14px;margin-top:10px;min-height:20px}
.msg.bad{color:var(--danger)}
.ai{padding:12px 20px;margin:0;font-size:15px;line-height:1.55;border-top:1px solid var(--line);white-space:pre-wrap}
.zres{padding:14px 20px;border-top:1px solid var(--line)}
.zres b{display:block;font-family:var(--f-mono);font-weight:500;font-size:28px;margin:4px 0}
</style>

<main>

</nav>

    document.querySelectorAll('#curSeg button').forEach(function (b) { b.setAttribute('aria-selected', String(Number(b.dataset.cur) === CUR)); });
    var late = (D.d || []).filter(function (d) { return !d[9] && d[6] && d[6] <= D.today && d[5] > 0; }).length;
    $('debtBdg').hidden = !late; $('debtBdg').textContent = String(late);
    ({ home: renderHome, list: renderList, plan: renderPlan, debt: renderDebt, more: renderMore })[TAB]();
  }
  function go(tab) {
    TAB = tab;
    ['home', 'list', 'plan', 'debt', 'more'].forEach(function (t) { $('v-' + t).hidden = t !== tab; });
    $('monthBar').hidden = tab === 'more' || tab === 'debt';
    document.querySelectorAll('.tabs button').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === tab)); });
    render();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('.tabs button').forEach(function (b) { b.addEventListener('click', function () { go(b.dataset.tab); }); });
  document.querySelectorAll('#curSeg button').forEach(function (b) { b.addEventListener('click', function () { CUR = Number(b.dataset.cur); render(); }); });
  $('mPrev').appendChild(ico('back', 18)); $('mNext').appendChild(ico('chev', 18));
  $('mPrev').addEventListener('click', function () { MONTH = shiftMonth(MONTH, -1); showCached(); load(true); });
  $('mNext').addEventListener('click', function () { if (MONTH < THIS_MONTH) { MONTH = shiftMonth(MONTH, 1); showCached(); load(true); } });

  // ---------- Kesh ----------
  function uidKey() { try { return String(tg.initDataUnsafe.user.id); } catch (e) { return 'x'; } }
  function cacheKey(m) { return 'pb2:' + uidKey() + ':' + m; }
  function showCached() {
    var c = null; try { c = JSON.parse(localStorage.getItem(cacheKey(MONTH)) || 'null'); } catch (e) {}
    if (c && c.m === MONTH && c.v === 2) D = c;
    else if (D) { D = { v: 2, m: MONTH, today: D.today, last: D.last, e: [], mo: D.mo, a: D.a, d: D.d, g: D.g, b: [] }; }
    render();
  }
  function keep(d) { var c = JSON.parse(JSON.stringify(d)); delete c.r; try { localStorage.setItem(cacheKey(d.m), JSON.stringify(c)); } catch (e) {} }

  // ---------- Bot bilan aloqa (shifrlangan, ntfy.sh orqali) ----------
  var H = new URLSearchParams(window.__pbHash.replace(/^#/, ''));
  var BOT_PUB = H.get('k') || '', REQ = H.get('q') || '';
  // Mahalliy sinovda (faqat 127.0.0.1) soxta ntfy; boshqa hamma joyda ntfy.sh
  var NTFY = (location.hostname === '127.0.0.1' && typeof window.__PB_TEST_NTFY === 'string') ? window.__PB_TEST_NTFY : 'https://ntfy.sh';
  function b64u(bytes) { var s = ''; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function b64bytes(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), o = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) o[i] = b.charCodeAt(i); return o; }
  function rnd(n) { return b64u(crypto.getRandomValues(new Uint8Array(n))); }
  async function hkdfKey(shared, salt, info, use) {
    var hk = await crypto.subtle.importKey('raw', shared, 'HKDF', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: salt, info: new TextEncoder().encode(info) }, hk, { name: 'AES-GCM', length: 256 }, false, [use]);
  }
  async function seal(plain) {
    var S = crypto.subtle;
    var bk = await S.importKey('raw', b64bytes(BOT_PUB), { name: 'ECDH', namedCurve: 'P-256' }, false, []);
    var eph = await S.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
    var aes = await hkdfKey(await S.deriveBits({ name: 'ECDH', public: bk }, eph.privateKey, 256), new Uint8Array(0), 'pb-app-v1', 'encrypt');
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var ct = new Uint8Array(await S.encrypt({ name: 'AES-GCM', iv: iv }, aes, new TextEncoder().encode(plain)));
    var pub = new Uint8Array(await S.exportKey('raw', eph.publicKey));
    var out = new Uint8Array(65 + 12 + ct.length); out.set(pub, 0); out.set(iv, 65); out.set(ct, 77);
    return b64u(out);
  }
  async function unseal(kp, msg, salt) {
    var S = crypto.subtle, raw = b64bytes(msg);
    if (raw.length < 65 + 12 + 17 || raw.length > 6000) return null;
    var bk = await S.importKey('raw', raw.slice(0, 65), { name: 'ECDH', namedCurve: 'P-256' }, false, []);
    var aes = await hkdfKey(await S.deriveBits({ name: 'ECDH', public: bk }, kp.privateKey, 256), salt, 'pb-get-v1', 'decrypt');
    var pt = await S.decrypt({ name: 'AES-GCM', iv: raw.slice(65, 77) }, aes, raw.slice(77));
    return new TextDecoder('utf-8', { fatal: true }).decode(pt);
  }
  async function inflate(b64) {
    var out = new Blob([b64bytes(b64)]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return JSON.parse(await new Response(out).text());
  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  // Bitta so'rov: a = {t: 'get' | amal, ...}; javob - shu oyning yangi ma'lumoti (+ r: amal natijasi)
  async function call(a, m, limitMs) {
    var kp = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
    var pageKey = b64u(new Uint8Array(await crypto.subtle.exportKey('raw', kp.publicKey)));
    var saltB = crypto.getRandomValues(new Uint8Array(32)), topic = 'pb-r-' + rnd(24);
    var req = Object.assign({}, a, { m: m, k: pageKey, r: topic, s: b64u(saltB) });
    var body = 'pa1 ' + await seal(JSON.stringify({ v: 1, i: INIT, n: rnd(18), a: req }));
    var r = await fetch(NTFY + '/' + REQ, { method: 'POST', body: body, headers: { 'Content-Type': 'text/plain' }, cache: 'no-store', credentials: 'omit' });
    if (!r.ok) throw new Error(r.status === 429 ? "kunlik chegara, keyinroq urinib ko'ring" : 'server ' + r.status);
    var parts = {}, total = 0, t0 = Date.now();
    while (Date.now() - t0 < (limitMs || 40000)) {
      await wait(Date.now() - t0 < 6000 ? 1000 : 2500);
      var p = await fetch(NTFY + '/' + topic + '/json?poll=1&since=all', { cache: 'no-store', credentials: 'omit' }).catch(function () { return null; });
      if (!p || !p.ok) continue;
      var lines = (await p.text()).split('\n');
      for (var i = 0; i < lines.length; i++) {
        var j; try { j = JSON.parse(lines[i]); } catch (e) { continue; }
        if (!j || j.event !== 'message' || typeof j.message !== 'string' || j.message.indexOf('pr1 ') !== 0) continue;
        var pt; try { pt = await unseal(kp, j.message.slice(4), saltB); } catch (e) { continue; }
        var mm = pt && /^(\d+)\/(\d+):([A-Za-z0-9_-]+)$/.exec(pt);
        if (mm) { parts[mm[1]] = mm[3]; total = Number(mm[2]); }
      }
      if (total && Object.keys(parts).length >= total) {
        var z = ''; for (var k = 1; k <= total; k++) z += parts[k];
        var d = await inflate(z);
        if (!d || d.v !== 2 || d.m !== m) throw new Error("noto'g'ri javob");
        return d;
      }
    }
    throw new Error('bot javob bermadi (Mac yoqilganmi?)');
  }
  function canAsk() {
    if (window.__PB_DEMO) return true;
    if (!INIT || !BOT_PUB || !REQ) { status('Sahifani botdagi «Daftar» tugmasidan oching.', 'bad', true); return false; }
    return true;
  }

  async function load(manual) {
    if (busy) { if (manual) again = true; return; }
    if (!manual && Date.now() - lastLoad < 7000) return; // qo'llanma: 7 soniyadan tez-tez emas
    if (window.__PB_DEMO) { D = window.__PB_DEMO(MONTH); render(); return; }
    if (!canAsk()) return;
    busy = true; lastLoad = Date.now();
    var want = MONTH;
    if (!D) status('Yuklanmoqda…', '', true);
    try {
      var d = await call({ t: 'get' }, want);
      keep(d);
      if (MONTH === want) { D = d; status(''); render(); }
    } catch (e) {
      if (MONTH === want) status("Yangilab bo'lmadi: " + (e && e.message ? e.message : e), 'bad', true);
    } finally {
      busy = false;
      if (again || MONTH !== want) { again = false; load(true); }
    }
  }

  // Amal yuborish: forma tugmalari o'chadi, natija formada va tepada ko'rinadi
  var sending = false;
  async function send(a, msgEl, closeAfter, after) {
    if (sending || !canAsk()) return;
    if (!window.__PB_DEMO && Date.now() - OPENED > 7000 * 1000) { msgEl.className = 'msg bad'; msgEl.textContent = 'Sahifa eskirdi — yopib, qaytadan oching.'; return; }
    sending = true;
    $('v-sheet').querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    msgEl.className = 'msg'; if (a.t !== 'advice') msgEl.textContent = 'Saqlanmoqda…';
    try {
      var d = window.__PB_DEMO ? window.__PB_DEMO_ACT(a, MONTH) : await call(a, MONTH, a.t === 'advice' ? 90000 : 40000);
      keep(d); D = d;
      var r = d.r || { ok: false, msg: 'Javob yo\'q' };
      if (!r.ok) { msgEl.className = 'msg bad'; msgEl.textContent = r.msg; return; }
      if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} }
      var extra = (r.warn || []).join(' ');
      if (closeAfter) { closeSheet(); status(r.msg + (extra ? ' · ' + extra : ''), extra ? 'bad' : 'good', !!extra); }
      else { msgEl.textContent = r.msg; if (after) after(r); status(r.msg, 'good'); }
    } catch (e) {
      msgEl.className = 'msg bad'; msgEl.textContent = "Yuborib bo'lmadi: " + (e && e.message ? e.message : e);
    } finally {
      sending = false;
      $('v-sheet').querySelectorAll('button').forEach(function (b) { b.disabled = false; });
    }
  }

  // Sahifa qayta ko'rinsa (Telegram'dan qaytilsa) yumshoq yangilanadi; forma ochiq bo'lsa kutadi
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !SHEET) load(false); });
  showCached();
  load(true);
})();
</script>
